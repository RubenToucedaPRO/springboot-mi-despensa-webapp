services:
  mysql:
    image: mysql:8.0
    container_name: midespensa-mysql
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: midespensa_bd
    ports:
      - "3309:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: midespensa-app
    restart: unless-stopped
    env_file: .env
    ports:
      - "${SERVER_PORT}:8081"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/midespensa_bd
      SSL_ENABLE: "True"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
