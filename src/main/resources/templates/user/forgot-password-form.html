<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{layouts/layout-without-nav :: layout-without-nav(title=~{::title/text()},
                    content=~{::#content}, pageScripts=~{})}">
<head>
<title>Mi Despensa - Olvidé mi contraseña</title>
</head>
<body>

	<div id="content">

		<div class="container-principal">
			<div class="form-container-login">
				<div class="card-body-login">
					<h3 class="form-title"> <i class="bi bi-arrow-counterclockwise"></i> Restablecer contraseña</h3>

					<form th:action="@{/user/forgot-password}" method="post">
						<div class="mb-3">
							<input type="email" class="form-control" id="email" name="email"
								placeholder="Correo electrónico" required>
						</div>
						<div class="text-center">
							<button type="submit"
								class="btn btn-modern btn-modern-primary w-100"><i class="bi bi-send me-2"></i> Solicitar</button>
						</div>

						<div class="form-divider">
							<span>o</span>
						</div>

						<div class="mt-3 text-center">
							<a th:href="@{/user/login-form}"
								class="btn btn-modern btn-modern-secondary w-100"> <i class="bi bi-arrow-left me-2"></i> Volver</a>
						</div>
					</form>
				</div>
			</div>
		</div>

	</div>

</body>
</html>
