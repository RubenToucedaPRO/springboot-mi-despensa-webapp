<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{layouts/layout-without-nav :: layout-without-nav(title=~{::title/text()},
                    content=~{::#content}, pageScripts=~{})}">
<head>
<title>Mi Despensa - Reset contraseña</title>
</head>
<body>

	<div id="content">
	
		<div class="container-principal">
			<div class="form-container-login">
				<div class="card-body-login">
					<h3 class="form-title"> <i class="bi bi-arrow-counterclockwise"></i> Restablecer contraseña</h3>

					<form th:action="@{/user/reset-password}" method="post">
						<!-- Campo oculto para enviar el token -->
						<input type="hidden" name="token" th:value="${token}" />

						<div class="mb-3">
							<label for="password" class="form-label">Nueva
								Contraseña:</label> <input type="password" class="form-control"
								id="password" name="password" required>
						</div>
						<div class="mb-3">
							<label for="confirmPassword" class="form-label">Confirmar
								Nueva Contraseña:</label> <input type="password" class="form-control"
								id="confirmPassword" name="confirmPassword" required>
						</div>
						<button type="submit" class="btn btn-modern btn-modern-primary w-100"><i class="bi bi-key"></i> Restablecer
							Contraseña</button>
					</form>
				</div>
			</div>
		</div>
		
	</div>

</body>
</html>
