<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<div
	th:fragment="recipe-form(title, recipeDTO, categories, difficulties)">
	<div class="container mt-4">
		<div class="card mb-4">
			<div class="card-header">
				<h5 class="card-title">Detalles de la receta</h5>
			</div>
			<div class="card-body">
				<!-- Formulario -->
				<form th:action="@{/recipes/edit}" th:object="${recipeDTO}"
					method="post" enctype="multipart/form-data">
					<!--  -->
					<input type="hidden" id="idUser" th:field="*{idUser}" />
					<!--  -->
					<input type="hidden" th:field="*{id}" /> <input type="hidden"
						th:field="*{image}" />
					<div class="mb-3">
						<label for="title" class="form-label">Título:</label>
						<!--  -->
						<input type="text" id="title" class="form-control"
							th:field="*{title}" maxlength="50" required="required" />
					</div>
					<div class="d-flex mb-3">
						<!-- Categoria -->
						<div class="me-3 w-50">
							<label for="category" class="form-label">Categoria:</label>
							<!--  -->
							<select id="category" class="form-control"
								th:field="*{category.id}">
								<option th:each="category: ${categories}"
									th:value="${category.id}" th:text="${category.title}"></option>
							</select>
						</div>
						<!-- Dificultad -->
						<div class="w-50">
							<label for="difficulty" class="form-label">Dificultad:</label>
							<!--  -->
							<select id="difficulty" class="form-control"
								th:field="*{difficulty.id}">
								<option th:each="difficulty: ${difficulties}"
									th:value="${difficulty.id}" th:text="${difficulty.title}"></option>
							</select>
						</div>
					</div>

					<div class="d-flex mb-3">
						<!-- Tiempo	preparación -->
						<div class="me-3 w-50">
							<label for="prepTime" class="form-label">Tiempo
								preparación:</label>
							<!--  -->
							<input type="number" id="prepTime" class="form-control"
								th:field="*{prepTime}" min="1" required="required" />
						</div>
						<!-- Tiempo de cocción -->
						<div class="w-50">
							<label for="cookTime" class="form-label">Tiempo de
								cocción:</label>
							<!--  -->
							<input type="number" id="cookTime" class="form-control"
								th:field="*{cookTime}" min="1" required="required" />
						</div>
					</div>
					<!-- Ingredientes -->
					<div class="mb-3">
						<label for="ingredients">Ingredientes:</label>
						<!--  -->
						<input id="ingredients" name="ingredientNames"
							placeholder="Escribe o selecciona ingredientes"
							th:field="*{ingredientNames}" class="form-control"
							required="required" />
					</div>
					<!-- Elaboracion -->
					<div class="mb-3">
						<label for="elaboration" class="form-label">Elaboración:</label>
						<!--  -->
						<textarea id="elaboration" class="form-control"
							th:field="*{elaboration}" th:rows="8" required="required"></textarea>
					</div>
					<!-- Tags -->
					<div class="mb-3">
						<label for="tags">Tags:</label>
						<!--  -->
						<input id="tags" name="tagNames"
							placeholder="Escribe o selecciona tags" th:field="*{tagNames}"
							class="form-control" />
					</div>
					<!-- Imagen actual -->
					<div class="mb-3" th:if="${recipeDTO.image != null}">
						<label class="form-label">Imagen actual:</label>
						<div>
							<img th:src="@{https://res.cloudinary.com/dsejfybvk/image/upload/v1746049192/{image}.png(image=${recipeDTO.image})}"
								alt="Imagen actual" style="max-width: 200px;" />
						</div>
					</div>
					<!-- Campo para subir una nueva imagen -->
					<div class="mb-3">
						<label for="input-file" class="form-label">Imagen:</label>
						<!--  -->
						<input type="file" id="input-file" name="imageFile"
							class="form-control" />
					</div>
					<!-- Visibilidad otros usuarios -->
					<div class="form-check mb-3">
						<input class="form-check-input" type="checkbox" id="visible"
							th:field="*{shared}">
						<!--  -->
						<label class="form-check-label" for="visible"> Visible a
							otros usuarios </label>
					</div>
					<button type="submit" class="btn btn-primary">Guardar</button>
					<button type="reset" class="btn btn-warning">Restablecer</button>
					<!--boton-->
					<a class="btn btn-secondary" th:href="@{/recipes/list}">Volver</a>
				</form>
			</div>
		</div>
	</div>
	<script th:src="@{/js/tagify.js}"></script>
	<script th:src="@{/js/script-tags.js}"></script>
	<script th:src="@{/js/script-ingredients.js}"></script>
</div>
